<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kris Rui Wu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/dreampulse/computer-modern-web-font@master/font/Concrete/cmun-concrete.css">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'anthropic-bg': '#FFFFFF', // Page background
              'anthropic-text': '#191919', // Soft black
              'anthropic-accent': '#191919', // No accent colour: links are marked by underline, not hue
              'anthropic-stone': '#E8E8E8', // Neutral rule / fill
              'anthropic-gray': '#191919', // Same ink as body text; tints come from opacity
              'anthropic-leaf': '#8DA399', // Muted Sage Green
              'anthropic-sand': '#F3ECE2',
              'anthropic-mist': '#E3EBF2'
            },
            fontSize: {
              // 15px base. Running prose is additionally capped at `measure`
              // below so a line lands near 80 characters rather than 91.
              base: ['13px', '1.72'],
            },
            maxWidth: {
              measure: '480px',
              'measure-lg': '530px',
            },
            fontFamily: {
              // One face everywhere: Computer Modern Concrete, the LaTeX
              // serif. `sans` is kept as a key so existing font-sans classes
              // keep working; it resolves to the same face.
              serif: ['"Computer Modern Concrete"', 'Georgia', 'serif'],
              sans: ['"Computer Modern Concrete"', 'Georgia', 'serif'],
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out forwards',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #FFFFFF;
        color: #191919;
      }
      /* Custom scrollbar for a cleaner look */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #FFFFFF;
      }
      ::-webkit-scrollbar-thumb {
        background: #D8D8D8;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #A1A1A1;
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-router-dom": "https://esm.sh/react-router-dom@6.22.3?deps=react@18.2.0,react-dom@18.2.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
