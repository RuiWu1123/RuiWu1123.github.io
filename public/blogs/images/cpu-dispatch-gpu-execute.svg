<svg viewBox="0 0 1150 320" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <rect x="0" y="0" width="1150" height="320" fill="#F4F3EF"/>
  <text x="575" y="38" text-anchor="middle" font-size="22" font-weight="600" fill="#191919">CPU Dispatches, GPU Executes Asynchronously</text>

  <defs>
    <marker id="cgarrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#191919"/>
    </marker>
  </defs>

  <!-- Row 1: CPU side -->
  <rect x="40" y="90" width="320" height="56" rx="7" fill="#F3ECE2" stroke="#191919" stroke-width="1.2"/>
  <text x="200" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#191919">Python line</text>
  <text x="200" y="130" text-anchor="middle" font-size="11.5" fill="#191919">output = compute(a, b)</text>

  <rect x="400" y="90" width="320" height="56" rx="7" fill="#E6E4DD" stroke="#191919" stroke-width="1.2"/>
  <text x="560" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#191919">Framework</text>
  <text x="560" y="130" text-anchor="middle" font-size="11.5" fill="#191919">selects the low-level kernel</text>

  <rect x="760" y="90" width="320" height="56" rx="7" fill="#E3EBF2" stroke="#191919" stroke-width="1.2"/>
  <text x="920" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#191919">Driver</text>
  <text x="920" y="130" text-anchor="middle" font-size="11.5" fill="#191919">enqueues instruction on GPU</text>

  <line x1="360" y1="118" x2="400" y2="118" stroke="#191919" stroke-width="1.4" marker-end="url(#cgarrow)"/>
  <line x1="720" y1="118" x2="760" y2="118" stroke="#191919" stroke-width="1.4" marker-end="url(#cgarrow)"/>

  <text x="1080" y="170" text-anchor="end" font-size="11.5" fill="#6B6B6B">CPU doesn't wait — moves on immediately</text>

  <!-- connector down and back to the left -->
  <polyline points="920,146 920,180 200,180 200,210" fill="none" stroke="#191919" stroke-width="1.4" marker-end="url(#cgarrow)"/>

  <!-- Row 2: GPU side -->
  <rect x="40" y="210" width="320" height="56" rx="7" fill="#D97757" stroke="#191919" stroke-width="1.2"/>
  <text x="200" y="232" text-anchor="middle" font-size="13" font-weight="600" fill="#F4F3EF">GPU</text>
  <text x="200" y="250" text-anchor="middle" font-size="11.5" fill="#F4F3EF">pulls the instruction from its queue</text>

  <rect x="400" y="210" width="320" height="56" rx="7" fill="#D97757" stroke="#191919" stroke-width="1.2"/>
  <text x="560" y="232" text-anchor="middle" font-size="13" font-weight="600" fill="#F4F3EF">Expands</text>
  <text x="560" y="250" text-anchor="middle" font-size="11.5" fill="#F4F3EF">into many parallel threads</text>

  <rect x="760" y="210" width="320" height="56" rx="7" fill="#D97757" stroke="#191919" stroke-width="1.2"/>
  <text x="920" y="232" text-anchor="middle" font-size="13" font-weight="600" fill="#F4F3EF">Executes</text>
  <text x="920" y="250" text-anchor="middle" font-size="11.5" fill="#F4F3EF">across the GPU's compute units</text>

  <line x1="360" y1="238" x2="400" y2="238" stroke="#191919" stroke-width="1.4" marker-end="url(#cgarrow)"/>
  <line x1="720" y1="238" x2="760" y2="238" stroke="#191919" stroke-width="1.4" marker-end="url(#cgarrow)"/>
</svg>
