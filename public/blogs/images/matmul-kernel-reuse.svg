<svg viewBox="0 0 1150 380" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <rect x="0" y="0" width="1150" height="380" fill="#F4F3EF"/>
  <text x="575" y="34" text-anchor="middle" font-size="21" font-weight="600" fill="#191919">Why Reuse Beats Redundant Reads</text>

  <defs>
    <marker id="rarrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#191919"/>
    </marker>
  </defs>

  <line x1="575" y1="60" x2="575" y2="345" stroke="#191919" stroke-opacity="0.25" stroke-width="1.2"/>

  <!-- LEFT: naive -->
  <text x="285" y="75" text-anchor="middle" font-size="14" font-weight="600" fill="#191919">naive kernel</text>

  <rect x="135" y="90" width="300" height="55" rx="6" fill="#E6E4DD" stroke="#191919" stroke-width="1.1"/>
  <text x="285" y="113" text-anchor="middle" font-size="12" fill="#191919">global memory (slow)</text>
  <text x="285" y="130" text-anchor="middle" font-size="12" font-weight="600" fill="#191919">row 2 of A: [7, 8, 9]</text>

  <rect x="135" y="230" width="130" height="55" rx="6" fill="#F3ECE2" stroke="#191919" stroke-width="1.1"/>
  <text x="200" y="253" text-anchor="middle" font-size="11.5" font-weight="600" fill="#191919">thread (2,0)</text>
  <text x="200" y="270" text-anchor="middle" font-size="10.5" fill="#191919">computes C[2][0]</text>

  <rect x="305" y="230" width="130" height="55" rx="6" fill="#F3ECE2" stroke="#191919" stroke-width="1.1"/>
  <text x="370" y="253" text-anchor="middle" font-size="11.5" font-weight="600" fill="#191919">thread (2,1)</text>
  <text x="370" y="270" text-anchor="middle" font-size="10.5" fill="#191919">computes C[2][1]</text>

  <line x1="230" y1="230" x2="270" y2="145" stroke="#191919" stroke-width="1.4" marker-end="url(#rarrow)"/>
  <line x1="340" y1="230" x2="300" y2="145" stroke="#191919" stroke-width="1.4" marker-end="url(#rarrow)"/>

  <text x="285" y="315" text-anchor="middle" font-size="12" fill="#191919">2 separate reads</text>
  <text x="285" y="332" text-anchor="middle" font-size="12" fill="#191919">of the same 3 numbers</text>

  <!-- RIGHT: tiled -->
  <text x="865" y="75" text-anchor="middle" font-size="14" font-weight="600" fill="#191919">tiled kernel</text>

  <rect x="715" y="90" width="300" height="55" rx="6" fill="#E6E4DD" stroke="#191919" stroke-width="1.1"/>
  <text x="865" y="113" text-anchor="middle" font-size="12" fill="#191919">global memory (slow)</text>
  <text x="865" y="130" text-anchor="middle" font-size="12" font-weight="600" fill="#191919">row 2 of A: [7, 8, 9]</text>

  <line x1="865" y1="145" x2="865" y2="170" stroke="#191919" stroke-width="1.4" marker-end="url(#rarrow)"/>
  <text x="905" y="162" text-anchor="start" font-size="10.5" fill="#6B6B6B">load once</text>

  <rect x="765" y="175" width="200" height="42" rx="6" fill="#D97757" stroke="#191919" stroke-width="1.1"/>
  <text x="865" y="201" text-anchor="middle" font-size="12" font-weight="600" fill="#F4F3EF">fast local memory</text>

  <rect x="715" y="245" width="130" height="55" rx="6" fill="#F3ECE2" stroke="#191919" stroke-width="1.1"/>
  <text x="780" y="268" text-anchor="middle" font-size="11.5" font-weight="600" fill="#191919">thread (2,0)</text>
  <text x="780" y="285" text-anchor="middle" font-size="10.5" fill="#191919">computes C[2][0]</text>

  <rect x="885" y="245" width="130" height="55" rx="6" fill="#F3ECE2" stroke="#191919" stroke-width="1.1"/>
  <text x="950" y="268" text-anchor="middle" font-size="11.5" font-weight="600" fill="#191919">thread (2,1)</text>
  <text x="950" y="285" text-anchor="middle" font-size="10.5" fill="#191919">computes C[2][1]</text>

  <line x1="800" y1="245" x2="835" y2="217" stroke="#191919" stroke-width="1.4" marker-end="url(#rarrow)"/>
  <line x1="930" y1="245" x2="895" y2="217" stroke="#191919" stroke-width="1.4" marker-end="url(#rarrow)"/>

  <text x="865" y="330" text-anchor="middle" font-size="12" fill="#191919">1 read, reused twice</text>

  <text x="575" y="365" text-anchor="middle" font-size="11.5" fill="#6B6B6B">at real matrix sizes, a row can otherwise get re-read once per output column — reuse is where the speedup comes from</text>
</svg>
