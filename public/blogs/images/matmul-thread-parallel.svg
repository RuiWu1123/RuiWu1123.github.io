<svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <rect x="0" y="0" width="1000" height="400" fill="#F4F3EF"/>
  <text x="500" y="38" text-anchor="middle" font-size="22" font-weight="600" fill="#191919">Which Numbers Feed C[2][1]</text>

  <defs>
    <marker id="tparrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#D97757"/>
    </marker>
  </defs>

  <text x="125" y="90" text-anchor="middle" font-size="15" font-weight="600" fill="#191919">A</text>
  <!-- A: 4 rows x 3 cols, cell 30x30, origin (80,100) -->
  <g stroke="#191919" stroke-width="1">
    <rect x="80" y="100" width="30" height="30" fill="#F3ECE2"/>
    <rect x="110" y="100" width="30" height="30" fill="#F3ECE2"/>
    <rect x="140" y="100" width="30" height="30" fill="#F3ECE2"/>
    <rect x="80" y="130" width="30" height="30" fill="#F3ECE2"/>
    <rect x="110" y="130" width="30" height="30" fill="#F3ECE2"/>
    <rect x="140" y="130" width="30" height="30" fill="#F3ECE2"/>
    <rect x="80" y="160" width="30" height="30" fill="#D97757"/>
    <rect x="110" y="160" width="30" height="30" fill="#D97757"/>
    <rect x="140" y="160" width="30" height="30" fill="#D97757"/>
    <rect x="80" y="190" width="30" height="30" fill="#F3ECE2"/>
    <rect x="110" y="190" width="30" height="30" fill="#F3ECE2"/>
    <rect x="140" y="190" width="30" height="30" fill="#F3ECE2"/>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#191919">
    <text x="95" y="119">1</text><text x="125" y="119">2</text><text x="155" y="119">3</text>
    <text x="95" y="149">4</text><text x="125" y="149">5</text><text x="155" y="149">6</text>
    <text x="95" y="179" fill="#F4F3EF">7</text><text x="125" y="179" fill="#F4F3EF">8</text><text x="155" y="179" fill="#F4F3EF">9</text>
    <text x="95" y="209">10</text><text x="125" y="209">11</text><text x="155" y="209">12</text>
  </g>
  <text x="125" y="238" text-anchor="middle" font-size="11" fill="#6B6B6B">row 2: [7, 8, 9]</text>

  <text x="380" y="90" text-anchor="middle" font-size="15" font-weight="600" fill="#191919">B</text>
  <!-- B: 3 rows x 2 cols, cell 30x30, origin (350,100) -->
  <g stroke="#191919" stroke-width="1">
    <rect x="350" y="100" width="30" height="30" fill="#F3ECE2"/>
    <rect x="380" y="100" width="30" height="30" fill="#D97757"/>
    <rect x="350" y="130" width="30" height="30" fill="#F3ECE2"/>
    <rect x="380" y="130" width="30" height="30" fill="#D97757"/>
    <rect x="350" y="160" width="30" height="30" fill="#F3ECE2"/>
    <rect x="380" y="160" width="30" height="30" fill="#D97757"/>
  </g>
  <g font-size="12.5" text-anchor="middle">
    <text x="365" y="119" fill="#191919">1</text><text x="395" y="119" fill="#F4F3EF">0</text>
    <text x="365" y="149" fill="#191919">0</text><text x="395" y="149" fill="#F4F3EF">1</text>
    <text x="365" y="179" fill="#191919">1</text><text x="395" y="179" fill="#F4F3EF">1</text>
  </g>
  <text x="395" y="208" text-anchor="middle" font-size="11" fill="#6B6B6B">column 1: [0, 1, 1]</text>

  <text x="690" y="90" text-anchor="middle" font-size="15" font-weight="600" fill="#191919">C = A @ B</text>
  <!-- C: 4 rows x 2 cols, cell 40x40, origin (650,100) -->
  <g stroke="#191919" stroke-width="1">
    <rect x="650" y="100" width="40" height="40" fill="#E6E4DD"/>
    <rect x="690" y="100" width="40" height="40" fill="#E6E4DD"/>
    <rect x="650" y="140" width="40" height="40" fill="#E6E4DD"/>
    <rect x="690" y="140" width="40" height="40" fill="#E6E4DD"/>
    <rect x="650" y="180" width="40" height="40" fill="#D97757"/>
    <rect x="690" y="180" width="40" height="40" fill="#E6E4DD"/>
    <rect x="650" y="220" width="40" height="40" fill="#E6E4DD"/>
    <rect x="690" y="220" width="40" height="40" fill="#E6E4DD"/>
  </g>
  <g font-size="13.5" text-anchor="middle" fill="#191919">
    <text x="670" y="124">4</text><text x="710" y="124">5</text>
    <text x="670" y="164">10</text><text x="710" y="164">11</text>
    <text x="670" y="204">16</text><text x="710" y="204" fill="#F4F3EF" font-weight="600">17</text>
    <text x="670" y="244">22</text><text x="710" y="244">23</text>
  </g>
  <text x="670" y="278" text-anchor="middle" font-size="11" font-weight="600" fill="#191919">C[2][1] = 17</text>
  <text x="670" y="294" text-anchor="middle" font-size="11" fill="#6B6B6B">one thread</text>

  <!-- arrows converging into the highlighted cell -->
  <path d="M170,175 C 400,175 560,200 650,198" fill="none" stroke="#D97757" stroke-width="1.6" marker-end="url(#tparrow)"/>
  <path d="M395,190 C 500,260 560,200 650,200" fill="none" stroke="#D97757" stroke-width="1.6" marker-end="url(#tparrow)"/>

  <text x="500" y="345" text-anchor="middle" font-size="13" fill="#191919">C[2][1] = row 2 of A · column 1 of B = 7·0 + 8·1 + 9·1 = 17</text>
  <text x="500" y="368" text-anchor="middle" font-size="12" fill="#6B6B6B">8 cells in C → 8 independent dot products → 8 threads working at once</text>
</svg>
