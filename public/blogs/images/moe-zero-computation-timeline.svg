<svg viewBox="0 0 1100 220" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <rect x="0" y="0" width="1100" height="220" fill="#F4F3EF"/>
  <text x="550" y="38" text-anchor="middle" font-size="22" font-weight="600" fill="#191919">From Null Experts to a Trillion-Parameter Model</text>

  <line x1="100" y1="110" x2="1000" y2="110" stroke="#191919" stroke-opacity="0.3" stroke-width="1.8"/>

  <circle cx="100" cy="110" r="9" fill="#6B6B6B"/>
  <circle cx="400" cy="110" r="9" fill="#6B6B6B"/>
  <circle cx="700" cy="110" r="13" fill="#D97757" stroke="#191919" stroke-width="1.6"/>
  <circle cx="1000" cy="110" r="13" fill="#191919"/>

  <text x="100" y="72" text-anchor="middle" font-size="15" font-weight="600" fill="#191919">AdaMoE</text>
  <text x="100" y="90" text-anchor="middle" font-size="12.5" fill="#6B6B6B">2024/06</text>
  <text x="100" y="140" text-anchor="middle" font-size="12" fill="#6B6B6B">null experts</text>
  <text x="100" y="158" text-anchor="middle" font-size="12" fill="#6B6B6B">token-adaptive routing</text>

  <text x="400" y="72" text-anchor="middle" font-size="15" font-weight="600" fill="#191919">MoE++</text>
  <text x="400" y="90" text-anchor="middle" font-size="12.5" fill="#6B6B6B">2024/10</text>
  <text x="400" y="140" text-anchor="middle" font-size="12" fill="#6B6B6B">zero / copy / constant</text>
  <text x="400" y="158" text-anchor="middle" font-size="12" fill="#6B6B6B">ICLR 2025 oral</text>

  <text x="700" y="72" text-anchor="middle" font-size="16" font-weight="600" fill="#191919">LongCat-Flash</text>
