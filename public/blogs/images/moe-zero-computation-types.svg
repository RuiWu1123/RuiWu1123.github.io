<svg viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <rect x="0" y="0" width="1000" height="340" fill="#F4F3EF"/>
  <text x="500" y="38" text-anchor="middle" font-size="22" font-weight="600" fill="#191919">Four Kinds of Expert Slot</text>

  <defs>
    <marker id="zarrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#191919"/>
    </marker>
  </defs>

  <!-- Column 1: Normal FFN expert -->
  <g>
    <text x="150" y="90" text-anchor="middle" font-size="14" font-weight="600" fill="#191919">Normal FFN Expert</text>
    <rect x="110" y="102" width="80" height="30" rx="5" fill="#F3ECE2" stroke="#191919" stroke-width="1"/>
    <text x="150" y="122" text-anchor="middle" font-size="12.5" fill="#191919">x</text>
    <line x1="150" y1="132" x2="150" y2="158" stroke="#191919" stroke-width="1.3" marker-end="url(#zarrow)"/>
    <rect x="80" y="162" width="140" height="80" rx="6" fill="#D97757" stroke="#191919" stroke-width="1.2"/>
    <text x="150" y="198" text-anchor="middle" font-size="12.5" font-weight="600" fill="#F4F3EF">runs full</text>
    <text x="150" y="216" text-anchor="middle" font-size="12.5" font-weight="600" fill="#F4F3EF">feed-forward</text>
    <line x1="150" y1="242" x2="150" y2="268" stroke="#191919" stroke-width="1.3" marker-end="url(#zarrow)"/>
    <text x="150" y="290" text-anchor="middle" font-size="13.5" font-weight="600" fill="#191919">FFN(x)</text>
    <text x="150" y="312" text-anchor="middle" font-size="11.5" fill="#6B6B6B">baseline</text>
  </g>

  <!-- Column 2: Zero expert -->
  <g>
    <text x="380" y="90" text-anchor="middle" font-size="14" font-weight="600" fill="#191919">Zero Expert</text>
    <rect x="340" y="102" width="80" height="30" rx="5" fill="#F3ECE2" stroke="#191919" stroke-width="1"/>
    <text x="380" y="122" text-anchor="middle" font-size="12.5" fill="#191919">x</text>
    <line x1="380" y1="132" x2="380" y2="158" stroke="#191919" stroke-width="1.3" marker-end="url(#zarrow)"/>
    <rect x="310" y="162" width="140" height="80" rx="6" fill="#E6E4DD" stroke="#191919" stroke-width="1.2"/>
    <text x="380" y="207" text-anchor="middle" font-size="12.5" font-weight="600" fill="#191919">discard</text>
    <line x1="380" y1="242" x2="380" y2="268" stroke="#191919" stroke-width="1.3" marker-end="url(#zarrow)"/>
    <text x="380" y="290" text-anchor="middle" font-size="13.5" font-weight="600" fill="#191919">0</text>
    <text x="380" y="312" text-anchor="middle" font-size="11.5" fill="#6B6B6B">AdaMoE's null expert</text>
  </g>

  <!-- Column 3: Copy expert -->
  <g>
    <text x="610" y="90" text-anchor="middle" font-size="14" font-weight="600" fill="#191919">Copy Expert</text>
    <rect x="570" y="102" width="80" height="30" rx="5" fill="#F3ECE2" stroke="#191919" stroke-width="1"/>
    <text x="610" y="122" text-anchor="middle" font-size="12.5" fill="#191919">x</text>
    <line x1="610" y1="132" x2="610" y2="158" stroke="#191919" stroke-width="1.3" marker-end="url(#zarrow)"/>
    <rect x="540" y="162" width="140" height="80" rx="6" fill="#E3EBF2" stroke="#191919" stroke-width="1.2"/>
    <text x="610" y="207" text-anchor="middle" font-size="12.5" font-weight="600" fill="#191919">pass through</text>
    <line x1="610" y1="242" x2="610" y2="268" stroke="#191919" stroke-width="1.3" marker-end="url(#zarrow)"/>
    <text x="610" y="290" text-anchor="middle" font-size="13.5" font-weight="600" fill="#191919">x</text>
    <text x="610" y="312" text-anchor="middle" font-size="11.5" fill="#6B6B6B">MoE++</text>
  </g>

  <!-- Column 4: Constant expert -->
  <g>
    <text x="840" y="90" text-anchor="middle" font-size="14" font-weight="600" fill="#191919">Constant Expert</text>
    <rect x="800" y="102" width="80" height="30" rx="5" fill="#F3ECE2" stroke="#191919" stroke-width="1"/>
    <text x="840" y="122" text-anchor="middle" font-size="12.5" fill="#191919">x</text>
    <line x1="840" y1="132" x2="840" y2="158" stroke="#191919" stroke-width="1.3" marker-end="url(#zarrow)"/>
    <rect x="770" y="162" width="140" height="80" rx="6" fill="#8DA399" stroke="#191919" stroke-width="1.2"/>
    <text x="840" y="198" text-anchor="middle" font-size="12.5" font-weight="600" fill="#F4F3EF">replace with</text>
    <text x="840" y="216" text-anchor="middle" font-size="12.5" font-weight="600" fill="#F4F3EF">trainable vector</text>
    <line x1="840" y1="242" x2="840" y2="268" stroke="#191919" stroke-width="1.3" marker-end="url(#zarrow)"/>
    <text x="840" y="290" text-anchor="middle" font-size="13.5" font-weight="600" fill="#191919">c</text>
    <text x="840" y="312" text-anchor="middle" font-size="11.5" fill="#6B6B6B">MoE++</text>
  </g>
</svg>
