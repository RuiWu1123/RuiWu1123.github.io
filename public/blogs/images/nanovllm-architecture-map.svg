<svg viewBox="0 0 1260 610" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <rect x="0" y="0" width="1260" height="610" fill="#F4F3EF"/>
  <text x="630" y="36" text-anchor="middle" font-size="22" font-weight="600" fill="#191919">Nano-vLLM: One Request's Path Through the Repo</text>

  <defs>
    <marker id="namarrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#191919"/>
    </marker>
  </defs>

  <!-- ============ ROW 1 ============ -->
  <!-- Box 1: LLMEngine -->
  <g>
    <rect x="40" y="90" width="270" height="200" rx="8" fill="#F3ECE2" stroke="#191919" stroke-width="1.2"/>
    <circle cx="60" cy="108" r="12" fill="#191919"/>
    <text x="60" y="113" text-anchor="middle" font-size="12" font-weight="600" fill="#F4F3EF">1</text>
    <text x="175" y="114" text-anchor="middle" font-size="15" font-weight="600" fill="#191919">LLMEngine</text>
    <text x="175" y="130" text-anchor="middle" font-size="10.5" fill="#6B6B6B">engine/llm_engine.py</text>
    <line x1="55" y1="140" x2="295" y2="140" stroke="#191919" stroke-opacity="0.3"/>
    <rect x="55" y="150" width="240" height="24" rx="5" fill="#F4F3EF" stroke="#191919" stroke-opacity="0.3"/>
    <text x="175" y="166" text-anchor="middle" font-size="11" font-family="monospace" fill="#191919">add_request()</text>
    <rect x="55" y="182" width="240" height="24" rx="5" fill="#F4F3EF" stroke="#191919" stroke-opacity="0.3"/>
    <text x="175" y="198" text-anchor="middle" font-size="11" font-family="monospace" fill="#191919">step()</text>
    <rect x="55" y="214" width="240" height="24" rx="5" fill="#F4F3EF" stroke="#191919" stroke-opacity="0.3"/>
    <text x="175" y="230" text-anchor="middle" font-size="11" font-family="monospace" fill="#191919">generate()</text>
  </g>

  <!-- Box 2: Scheduler -->
  <g>
    <rect x="340" y="90" width="270" height="200" rx="8" fill="#E6E4DD" stroke="#191919" stroke-width="1.2"/>
    <circle cx="360" cy="108" r="12" fill="#191919"/>
    <text x="360" y="113" text-anchor="middle" font-size="12" font-weight="600" fill="#F4F3EF">2</text>
    <text x="475" y="114" text-anchor="middle" font-size="15" font-weight="600" fill="#191919">Scheduler</text>
    <text x="475" y="130" text-anchor="middle" font-size="10.5" fill="#6B6B6B">engine/scheduler.py</text>
    <line x1="355" y1="140" x2="595" y2="140" stroke="#191919" stroke-opacity="0.3"/>
    <rect x="355" y="150" width="240" height="24" rx="5" fill="#F4F3EF" stroke="#191919" stroke-opacity="0.3"/>
    <text x="475" y="166" text-anchor="middle" font-size="11" font-family="monospace" fill="#191919">schedule()</text>
    <rect x="355" y="182" width="240" height="24" rx="5" fill="#F4F3EF" stroke="#191919" stroke-opacity="0.3"/>
    <text x="475" y="198" text-anchor="middle" font-size="11" font-family="monospace" fill="#191919">postprocess()</text>
    <rect x="355" y="214" width="240" height="24" rx="5" fill="#F4F3EF" stroke="#191919" stroke-opacity="0.3"/>
    <text x="475" y="230" text-anchor="middle" font-size="11" font-family="monospace" fill="#191919">preempt()</text>
  </g>

  <!-- Box 3: BlockManager -->
  <g>
    <rect x="640" y="90" width="270" height="200" rx="8" fill="#E3EBF2" stroke="#191919" stroke-width="1.2"/>
    <circle cx="660" cy="108" r="12" fill="#191919"/>
    <text x="660" y="113" text-anchor="middle" font-size="12" font-weight="600" fill="#F4F3EF">3</text>
    <text x="775" y="114" text-anchor="middle" font-size="15" font-weight="600" fill="#191919">BlockManager</text>
    <text x="775" y="130" text-anchor="middle" font-size="10.5" fill="#6B6B6B">engine/block_manager.py</text>
    <line x1="655" y1="140" x2="895" y2="140" stroke="#191919" stroke-opacity="0.3"/>
    <rect x="655" y="150" width="240" height="24" rx="5" fill="#F4F3EF" stroke="#191919" stroke-opacity="0.3"/>
    <text x="775" y="166" text-anchor="middle" font-size="11" font-family="monospace" fill="#191919">can_allocate() / allocate()</text>
    <rect x="655" y="182" width="240" height="24" rx="5" fill="#F4F3EF" stroke="#191919" stroke-opacity="0.3"/>
    <text x="775" y="198" text-anchor="middle" font-size="11" font-family="monospace" fill="#191919">can_append() / may_append()</text>
    <rect x="655" y="214" width="240" height="24" rx="5" fill="#F4F3EF" stroke="#191919" stroke-opacity="0.3"/>
    <text x="775" y="230" text-anchor="middle" font-size="11" font-family="monospace" fill="#191919">hash_blocks()</text>
  </g>

  <!-- Box 4: ModelRunner -->
  <g>
    <rect x="940" y="90" width="270" height="200" rx="8" fill="#F3ECE2" stroke="#191919" stroke-width="1.2"/>
    <circle cx="960" cy="108" r="12" fill="#191919"/>
    <text x="960" y="113" text-anchor="middle" font-size="12" font-weight="600" fill="#F4F3EF">4</text>
    <text x="1075" y="114" text-anchor="middle" font-size="15" font-weight="600" fill="#191919">ModelRunner</text>
    <text x="1075" y="130" text-anchor="middle" font-size="10.5" fill="#6B6B6B">engine/model_runner.py</text>
    <line x1="955" y1="140" x2="1195" y2="140" stroke="#191919" stroke-opacity="0.3"/>
    <rect x="955" y="150" width="240" height="24" rx="5" fill="#F4F3EF" stroke="#191919" stroke-opacity="0.3"/>
    <text x="1075" y="166" text-anchor="middle" font-size="11" font-family="monospace" fill="#191919">prepare_prefill()</text>
    <rect x="955" y="182" width="240" height="24" rx="5" fill="#F4F3EF" stroke="#191919" stroke-opacity="0.3"/>
    <text x="1075" y="198" text-anchor="middle" font-size="11" font-family="monospace" fill="#191919">prepare_decode()</text>
    <rect x="955" y="214" width="240" height="24" rx="5" fill="#F4F3EF" stroke="#191919" stroke-opacity="0.3"/>
    <text x="1075" y="230" text-anchor="middle" font-size="11" font-family="monospace" fill="#191919">run_model()</text>
  </g>

  <!-- row 1 arrows -->
  <line x1="310" y1="190" x2="338" y2="190" stroke="#191919" stroke-width="1.5" marker-end="url(#namarrow)"/>
  <line x1="610" y1="190" x2="638" y2="190" stroke="#191919" stroke-width="1.5" marker-end="url(#namarrow)"/>
  <line x1="910" y1="190" x2="938" y2="190" stroke="#191919" stroke-width="1.5" marker-end="url(#namarrow)"/>

  <!-- elbow row1 -> row2 -->
  <polyline points="1075,290 1075,312 205,312 205,330" fill="none" stroke="#191919" stroke-width="1.5" marker-end="url(#namarrow)"/>

  <!-- ============ ROW 2 ============ -->
  <!-- Box 5: Qwen3 Model -->
  <g>
    <rect x="15" y="330" width="380" height="180" rx="8" fill="#8DA399" stroke="#191919" stroke-width="1.2"/>
    <circle cx="35" cy="348" r="12" fill="#191919"/>
    <text x="35" y="353" text-anchor="middle" font-size="12" font-weight="600" fill="#F4F3EF">5</text>
    <text x="205" y="354" text-anchor="middle" font-size="15" font-weight="600" fill="#F4F3EF">Qwen3ForCausalLM</text>
    <text x="205" y="370" text-anchor="middle" font-size="10.5" fill="#F4F3EF">models/qwen3.py</text>
    <line x1="30" y1="380" x2="380" y2="380" stroke="#F4F3EF" stroke-opacity="0.4"/>
    <rect x="30" y="390" width="350" height="24" rx="5" fill="#F4F3EF" fill-opacity="0.15" stroke="#F4F3EF" stroke-opacity="0.3"/>
    <text x="205" y="406" text-anchor="middle" font-size="11" font-family="monospace" fill="#F4F3EF">embed_tokens</text>
    <rect x="30" y="422" width="350" height="24" rx="5" fill="#F4F3EF" fill-opacity="0.15" stroke="#F4F3EF" stroke-opacity="0.3"/>
    <text x="205" y="438" text-anchor="middle" font-size="11" font-family="monospace" fill="#F4F3EF">layers: N × Qwen3DecoderLayer</text>
    <rect x="30" y="454" width="350" height="24" rx="5" fill="#F4F3EF" fill-opacity="0.15" stroke="#F4F3EF" stroke-opacity="0.3"/>
    <text x="205" y="470" text-anchor="middle" font-size="11" font-family="monospace" fill="#F4F3EF">norm → lm_head</text>
  </g>

  <!-- Box 6: Attention (PagedAttention) -->
  <g>
    <rect x="435" y="330" width="380" height="180" rx="8" fill="#D97757" stroke="#191919" stroke-width="2"/>
    <circle cx="455" cy="348" r="12" fill="#191919"/>
    <text x="455" y="353" text-anchor="middle" font-size="12" font-weight="600" fill="#F4F3EF">6</text>
    <text x="625" y="354" text-anchor="middle" font-size="15" font-weight="600" fill="#F4F3EF">Attention — PagedAttention</text>
    <text x="625" y="370" text-anchor="middle" font-size="10.5" fill="#F4F3EF">layers/attention.py</text>
    <line x1="450" y1="380" x2="800" y2="380" stroke="#F4F3EF" stroke-opacity="0.4"/>
    <rect x="450" y="390" width="350" height="24" rx="5" fill="#F4F3EF" fill-opacity="0.15" stroke="#F4F3EF" stroke-opacity="0.3"/>
    <text x="625" y="406" text-anchor="middle" font-size="11" font-family="monospace" fill="#F4F3EF">store_kvcache_kernel()</text>
    <rect x="450" y="422" width="350" height="24" rx="5" fill="#F4F3EF" fill-opacity="0.15" stroke="#F4F3EF" stroke-opacity="0.3"/>
    <text x="625" y="438" text-anchor="middle" font-size="11" font-family="monospace" fill="#F4F3EF">forward() → flash_attn_*</text>
    <text x="625" y="466" text-anchor="middle" font-size="11" fill="#F4F3EF">— section 5 opens this up —</text>
  </g>

  <!-- Box 7: Sampler -->
  <g>
    <rect x="855" y="330" width="380" height="180" rx="8" fill="#E6E4DD" stroke="#191919" stroke-width="1.2"/>
    <circle cx="875" cy="348" r="12" fill="#191919"/>
    <text x="875" y="353" text-anchor="middle" font-size="12" font-weight="600" fill="#F4F3EF">7</text>
    <text x="1045" y="354" text-anchor="middle" font-size="15" font-weight="600" fill="#191919">Sampler</text>
    <text x="1045" y="370" text-anchor="middle" font-size="10.5" fill="#6B6B6B">layers/sampler.py</text>
    <line x1="870" y1="380" x2="1220" y2="380" stroke="#191919" stroke-opacity="0.3"/>
    <rect x="870" y="390" width="350" height="24" rx="5" fill="#F4F3EF" stroke="#191919" stroke-opacity="0.3"/>
    <text x="1045" y="406" text-anchor="middle" font-size="11" font-family="monospace" fill="#191919">forward(logits, temperature)</text>
    <text x="1045" y="440" text-anchor="middle" font-size="11" fill="#6B6B6B">temperature scale + Gumbel-max trick</text>
    <text x="1045" y="460" text-anchor="middle" font-size="11" fill="#6B6B6B">→ next token id</text>
  </g>

  <!-- row 2 arrows -->
  <line x1="395" y1="420" x2="433" y2="420" stroke="#191919" stroke-width="1.5" marker-end="url(#namarrow)"/>
  <line x1="815" y1="420" x2="853" y2="420" stroke="#191919" stroke-width="1.5" marker-end="url(#namarrow)"/>

  <!-- loop-back -->
  <polyline points="1045,510 1045,560 10,560 10,190 38,190" fill="none" stroke="#191919" stroke-opacity="0.55" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#namarrow)"/>
  <text x="527" y="578" text-anchor="middle" font-size="12" fill="#6B6B6B">generate()'s loop calls step() again — repeat until every sequence finishes</text>
</svg>
