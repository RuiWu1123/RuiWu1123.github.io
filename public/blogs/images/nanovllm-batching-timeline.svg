<text x="110" y="510" font-size="12" fill="#6B6B6B">C is admitted at round 3, preempted at round 4 when the pool fills, and re-prefilled at round 8 — it never waits for A or B to finish.</text>
<text x="110" y="529" font-size="12" fill="#6B6B6B">Under static batching C cannot start until round 12, and the same work takes 15 rounds instead of 11.</text>
