<svg viewBox="0 0 1240 330" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
<rect width="1240" height="330" fill="#F4F3EF"/>
<text x="620.0" y="30" text-anchor="middle" font-size="21" font-weight="600" fill="#191919">One Block Pool, Four Moments</text>
<text x="620.0" y="50" text-anchor="middle" font-size="12" fill="#6B6B6B">Blocks are shared by content hash and freed by reference count, never by owner. (Block size shrunk to 4 tokens, pool to 12.)</text>
<text x="20" y="80" font-size="13" font-weight="600" fill="#191919">1. Sequence A is allocated</text>
