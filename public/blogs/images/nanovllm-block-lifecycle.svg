<rect x="146" y="179" width="36" height="36" rx="5" fill="#F4F3EF" stroke="#191919" stroke-opacity="0.14" stroke-dasharray="3 2"/>
<text x="164.0" y="201" font-size="10" text-anchor="middle" fill="#191919" fill-opacity="0.3">11</text>
<text x="20" y="239" font-size="10.5" font-family="monospace" fill="#191919">A.block_table = [0, 1, 2]</text>
<text x="20" y="260" font-size="10" fill="#6B6B6B">11 tokens -> 3 blocks. The first two are</text>
<text x="20" y="273" font-size="10" fill="#6B6B6B">full, so they get chained content hashes.</text>
<text x="320" y="80" font-size="13" font-weight="600" fill="#191919">2. Sequence B hits the prefix cache</text>
