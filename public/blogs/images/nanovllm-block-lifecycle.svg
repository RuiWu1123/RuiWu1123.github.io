<rect x="662" y="179" width="36" height="36" rx="5" fill="#F4F3EF" stroke="#191919" stroke-opacity="0.14" stroke-dasharray="3 2"/>
<text x="680.0" y="201" font-size="10" text-anchor="middle" fill="#191919" fill-opacity="0.3">9</text>
<rect x="704" y="179" width="36" height="36" rx="5" fill="#F4F3EF" stroke="#191919" stroke-opacity="0.14" stroke-dasharray="3 2"/>
<text x="722.0" y="201" font-size="10" text-anchor="middle" fill="#191919" fill-opacity="0.3">10</text>
<rect x="746" y="179" width="36" height="36" rx="5" fill="#F4F3EF" stroke="#191919" stroke-opacity="0.14" stroke-dasharray="3 2"/>
<text x="764.0" y="201" font-size="10" text-anchor="middle" fill="#191919" fill-opacity="0.3">11</text>
<text x="620" y="239" font-size="10.5" font-family="monospace" fill="#191919">A.block_table = [0, 1, 2, 4]</text>
<text x="620" y="254" font-size="10.5" font-family="monospace" fill="#191919">B.block_table = [0, 1, 3]</text>
<text x="620" y="275" font-size="10" fill="#6B6B6B">len(seq) % block_size == 1, so may_append()</text>
<text x="620" y="288" font-size="10" fill="#6B6B6B">grabs exactly one more block - nowhere near</text>
<text x="620" y="301" font-size="10" fill="#6B6B6B">the others.</text>
