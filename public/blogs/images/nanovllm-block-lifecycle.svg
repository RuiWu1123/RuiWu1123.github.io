<text x="764.0" y="123" font-size="8.5" text-anchor="middle" fill="#191919">ref=1</text>
<rect x="620" y="137" width="36" height="36" rx="5" fill="#D97757" fill-opacity="0.35" stroke="#191919" stroke-opacity="0.35"/>
