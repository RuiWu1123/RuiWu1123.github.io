<text x="38.0" y="111" font-size="11" font-weight="700" text-anchor="middle" fill="#191919">0</text>
<text x="38.0" y="123" font-size="8.5" text-anchor="middle" fill="#191919">ref=1</text>
<rect x="62" y="95" width="36" height="36" rx="5" fill="#D97757" fill-opacity="0.35" stroke="#191919" stroke-opacity="0.35"/>
<text x="80.0" y="111" font-size="11" font-weight="700" text-anchor="middle" fill="#191919">1</text>
<text x="80.0" y="123" font-size="8.5" text-anchor="middle" fill="#191919">ref=1</text>
<rect x="104" y="95" width="36" height="36" rx="5" fill="#D97757" fill-opacity="0.35" stroke="#191919" stroke-opacity="0.35"/>
<text x="122.0" y="111" font-size="11" font-weight="700" text-anchor="middle" fill="#191919">2</text>
<text x="122.0" y="123" font-size="8.5" text-anchor="middle" fill="#191919">ref=1</text>
<rect x="146" y="95" width="36" height="36" rx="5" fill="#F4F3EF" stroke="#191919" stroke-opacity="0.14" stroke-dasharray="3 2"/>
<text x="164.0" y="117" font-size="10" text-anchor="middle" fill="#191919" fill-opacity="0.3">3</text>
<rect x="20" y="137" width="36" height="36" rx="5" fill="#F4F3EF" stroke="#191919" stroke-opacity="0.14" stroke-dasharray="3 2"/>
<text x="38.0" y="159" font-size="10" text-anchor="middle" fill="#191919" fill-opacity="0.3">4</text>
<rect x="62" y="137" width="36" height="36" rx="5" fill="#F4F3EF" stroke="#191919" stroke-opacity="0.14" stroke-dasharray="3 2"/>
