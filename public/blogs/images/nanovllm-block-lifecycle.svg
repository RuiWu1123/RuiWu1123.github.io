<text x="464.0" y="111" font-size="11" font-weight="700" text-anchor="middle" fill="#191919">3</text>
<text x="464.0" y="123" font-size="8.5" text-anchor="middle" fill="#191919">ref=1</text>
<rect x="320" y="137" width="36" height="36" rx="5" fill="#F4F3EF" stroke="#191919" stroke-opacity="0.14" stroke-dasharray="3 2"/>
<text x="338.0" y="159" font-size="10" text-anchor="middle" fill="#191919" fill-opacity="0.3">4</text>
<rect x="362" y="137" width="36" height="36" rx="5" fill="#F4F3EF" stroke="#191919" stroke-opacity="0.14" stroke-dasharray="3 2"/>
