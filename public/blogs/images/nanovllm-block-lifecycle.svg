<text x="920" y="239" font-size="10.5" font-family="monospace" fill="#191919">B.block_table = [0, 1, 3]</text>
<text x="920" y="260" font-size="10" fill="#6B6B6B">deallocate() decrements. Blocks 2 and 4 hit</text>
<text x="920" y="273" font-size="10" fill="#6B6B6B">zero and are freed; 0 and 1 survive because B</text>
