<rect x="446" y="179" width="36" height="36" rx="5" fill="#F4F3EF" stroke="#191919" stroke-opacity="0.14" stroke-dasharray="3 2"/>
<text x="464.0" y="201" font-size="10" text-anchor="middle" fill="#191919" fill-opacity="0.3">11</text>
<text x="320" y="239" font-size="10.5" font-family="monospace" fill="#191919">A.block_table = [0, 1, 2]</text>
<text x="320" y="254" font-size="10.5" font-family="monospace" fill="#191919">B.block_table = [0, 1, 3]</text>
<text x="320" y="275" font-size="10" fill="#6B6B6B">B shares A's system prompt: blocks 0 and 1</text>
<text x="320" y="288" font-size="10" fill="#6B6B6B">are reused, ref_count -> 2. Only B's tail</text>
<text x="320" y="301" font-size="10" fill="#6B6B6B">needs a new block.</text>
<text x="620" y="80" font-size="13" font-weight="600" fill="#191919">3. A crosses a block boundary</text>
<rect x="620" y="95" width="36" height="36" rx="5" fill="#8DA399" fill-opacity="0.85" stroke="#191919" stroke-opacity="0.35"/>
<text x="638.0" y="111" font-size="11" font-weight="700" text-anchor="middle" fill="#191919">0</text>
<text x="638.0" y="123" font-size="8.5" text-anchor="middle" fill="#191919">ref=2</text>
