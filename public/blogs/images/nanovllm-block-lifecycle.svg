<rect x="362" y="179" width="36" height="36" rx="5" fill="#F4F3EF" stroke="#191919" stroke-opacity="0.14" stroke-dasharray="3 2"/>
<text x="380.0" y="201" font-size="10" text-anchor="middle" fill="#191919" fill-opacity="0.3">9</text>
<rect x="404" y="179" width="36" height="36" rx="5" fill="#F4F3EF" stroke="#191919" stroke-opacity="0.14" stroke-dasharray="3 2"/>
