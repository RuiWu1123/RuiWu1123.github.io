<text x="164.0" y="159" font-size="10" text-anchor="middle" fill="#191919" fill-opacity="0.3">7</text>
<rect x="20" y="179" width="36" height="36" rx="5" fill="#F4F3EF" stroke="#191919" stroke-opacity="0.14" stroke-dasharray="3 2"/>
<text x="38.0" y="201" font-size="10" text-anchor="middle" fill="#191919" fill-opacity="0.3">8</text>
<rect x="62" y="179" width="36" height="36" rx="5" fill="#F4F3EF" stroke="#191919" stroke-opacity="0.14" stroke-dasharray="3 2"/>
