<text x="338.0" y="123" font-size="8.5" text-anchor="middle" fill="#191919">ref=2</text>
<rect x="362" y="95" width="36" height="36" rx="5" fill="#8DA399" fill-opacity="0.85" stroke="#191919" stroke-opacity="0.35"/>
<text x="380.0" y="111" font-size="11" font-weight="700" text-anchor="middle" fill="#191919">1</text>
<text x="380.0" y="123" font-size="8.5" text-anchor="middle" fill="#191919">ref=2</text>
<rect x="404" y="95" width="36" height="36" rx="5" fill="#D97757" fill-opacity="0.35" stroke="#191919" stroke-opacity="0.35"/>
