<svg viewBox="0 0 1150 470" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <rect x="0" y="0" width="1150" height="470" fill="#F4F3EF"/>
  <text x="575" y="34" text-anchor="middle" font-size="21" font-weight="600" fill="#191919">The Block Table: Logical Blocks → Scattered Physical Slots</text>

  <defs>
    <marker id="btarrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#191919"/>
    </marker>
  </defs>

  <text x="575" y="75" text-anchor="middle" font-size="12" fill="#6B6B6B">logical view — how this one sequence sees its own KV cache</text>

  <!-- logical blocks -->
  <rect x="215" y="88" width="200" height="70" rx="7" fill="#F3ECE2" stroke="#191919" stroke-width="1.1"/>
  <text x="315" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#191919">block 0</text>
  <text x="315" y="136" text-anchor="middle" font-size="11" fill="#6B6B6B">tokens 0–255</text>

  <rect x="475" y="88" width="200" height="70" rx="7" fill="#F3ECE2" stroke="#191919" stroke-width="1.1"/>
  <text x="575" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#191919">block 1</text>
  <text x="575" y="136" text-anchor="middle" font-size="11" fill="#6B6B6B">tokens 256–511</text>

  <rect x="735" y="88" width="200" height="70" rx="7" fill="#F3ECE2" stroke="#191919" stroke-width="1.1"/>
  <text x="835" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#191919">block 2 (partial)</text>
  <text x="835" y="136" text-anchor="middle" font-size="11" fill="#6B6B6B">tokens 512–535</text>

  <!-- seq.block_table entries -->
  <line x1="315" y1="158" x2="315" y2="188" stroke="#191919" stroke-width="1.3" marker-end="url(#btarrow)"/>
  <line x1="575" y1="158" x2="575" y2="188" stroke="#191919" stroke-width="1.3" marker-end="url(#btarrow)"/>
  <line x1="835" y1="158" x2="835" y2="188" stroke="#191919" stroke-width="1.3" marker-end="url(#btarrow)"/>

  <text x="575" y="182" text-anchor="middle" font-size="11" fill="#6B6B6B">seq.block_table[i]</text>

  <rect x="270" y="192" width="90" height="34" rx="6" fill="#191919"/>
  <text x="315" y="214" text-anchor="middle" font-size="14" font-family="monospace" fill="#F4F3EF">7</text>

  <rect x="530" y="192" width="90" height="34" rx="6" fill="#191919"/>
  <text x="575" y="214" text-anchor="middle" font-size="14" font-family="monospace" fill="#F4F3EF">2</text>

  <rect x="790" y="192" width="90" height="34" rx="6" fill="#191919"/>
  <text x="835" y="214" text-anchor="middle" font-size="14" font-family="monospace" fill="#F4F3EF">15</text>

  <text x="575" y="248" text-anchor="middle" font-size="12" fill="#6B6B6B">physical pool — a fixed, preallocated array of KV-cache blocks, shared by every sequence</text>

  <!-- curved arrows into the grid -->
  <path d="M315,226 C 400,270 480,290 606,257" fill="none" stroke="#D97757" stroke-width="1.6" marker-end="url(#btarrow)"/>
  <path d="M575,226 C 620,260 640,280 669,320" fill="none" stroke="#D97757" stroke-width="1.6" marker-end="url(#btarrow)"/>
  <path d="M835,226 C 780,300 730,380 696,446" fill="none" stroke="#D97757" stroke-width="1.6" marker-end="url(#btarrow)"/>

  <!-- physical grid: 4x4, ids 0-15 -->
  <g stroke="#191919" stroke-width="1">
    <rect x="453" y="230" width="55" height="55" rx="5" fill="#F3ECE2"/>
    <rect x="516" y="230" width="55" height="55" rx="5" fill="#F3ECE2"/>
    <rect x="579" y="230" width="55" height="55" rx="5" fill="#D97757"/>
    <rect x="642" y="230" width="55" height="55" rx="5" fill="#F3ECE2"/>

    <rect x="453" y="293" width="55" height="55" rx="5" fill="#F3ECE2"/>
    <rect x="516" y="293" width="55" height="55" rx="5" fill="#F3ECE2"/>
    <rect x="579" y="293" width="55" height="55" rx="5" fill="#F3ECE2"/>
    <rect x="642" y="293" width="55" height="55" rx="5" fill="#D97757"/>

    <rect x="453" y="356" width="55" height="55" rx="5" fill="#F3ECE2"/>
    <rect x="516" y="356" width="55" height="55" rx="5" fill="#F3ECE2"/>
    <rect x="579" y="356" width="55" height="55" rx="5" fill="#F3ECE2"/>
    <rect x="642" y="356" width="55" height="55" rx="5" fill="#F3ECE2"/>

    <rect x="453" y="419" width="55" height="43" rx="5" fill="#F3ECE2"/>
    <rect x="516" y="419" width="55" height="43" rx="5" fill="#F3ECE2"/>
    <rect x="579" y="419" width="55" height="43" rx="5" fill="#F3ECE2"/>
    <rect x="642" y="419" width="55" height="43" rx="5" fill="#D97757"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#191919">
    <text x="480" y="262">0</text><text x="543" y="262">1</text><text x="606" y="262" fill="#F4F3EF" font-weight="600">2</text><text x="669" y="262">3</text>
    <text x="480" y="325">4</text><text x="543" y="325">5</text><text x="606" y="325">6</text><text x="669" y="325" fill="#F4F3EF" font-weight="600">7</text>
    <text x="480" y="388">8</text><text x="543" y="388">9</text><text x="606" y="388">10</text><text x="669" y="388">11</text>
    <text x="480" y="444">12</text><text x="543" y="444">13</text><text x="606" y="444">14</text><text x="669" y="444" fill="#F4F3EF" font-weight="600">15</text>
  </g>
</svg>
