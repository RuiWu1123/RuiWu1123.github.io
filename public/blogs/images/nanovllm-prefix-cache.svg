<svg viewBox="0 0 1150 300" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <rect x="0" y="0" width="1150" height="300" fill="#F4F3EF"/>
  <text x="575" y="34" text-anchor="middle" font-size="21" font-weight="600" fill="#191919">Prefix Caching: Same Token-Hash, Same Physical Block</text>

  <text x="60" y="60" font-size="12" fill="#6B6B6B">— same system prompt, two different requests —</text>

  <!-- bracket over shared columns -->
  <path d="M225,80 L225,68 L575,68 L575,80" fill="none" stroke="#8DA399" stroke-width="1.6"/>
  <text x="400" y="60" text-anchor="middle" font-size="11.5" fill="#8DA399" font-weight="600">shared prefix → ref_count = 2, no recomputation</text>

  <!-- Sequence A -->
  <text x="60" y="130" font-size="13" font-weight="600" fill="#191919">Sequence A</text>
  <rect x="225" y="98" width="170" height="64" rx="7" fill="#8DA399" stroke="#191919" stroke-width="1.1"/>
  <text x="310" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#F4F3EF">block 0</text>
  <text x="310" y="142" text-anchor="middle" font-size="11" fill="#F4F3EF">physical block 4</text>

  <rect x="405" y="98" width="170" height="64" rx="7" fill="#8DA399" stroke="#191919" stroke-width="1.1"/>
  <text x="490" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#F4F3EF">block 1</text>
  <text x="490" y="142" text-anchor="middle" font-size="11" fill="#F4F3EF">physical block 9</text>

  <rect x="585" y="98" width="170" height="64" rx="7" fill="#D97757" stroke="#191919" stroke-width="1.1"/>
  <text x="670" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#F4F3EF">block 2</text>
  <text x="670" y="142" text-anchor="middle" font-size="11" fill="#F4F3EF">physical block 7 (own)</text>

  <!-- Sequence B -->
  <text x="60" y="230" font-size="13" font-weight="600" fill="#191919">Sequence B</text>
  <rect x="225" y="198" width="170" height="64" rx="7" fill="#8DA399" stroke="#191919" stroke-width="1.1"/>
  <text x="310" y="224" text-anchor="middle" font-size="12" font-weight="600" fill="#F4F3EF">block 0</text>
  <text x="310" y="242" text-anchor="middle" font-size="11" fill="#F4F3EF">physical block 4</text>

  <rect x="405" y="198" width="170" height="64" rx="7" fill="#8DA399" stroke="#191919" stroke-width="1.1"/>
  <text x="490" y="224" text-anchor="middle" font-size="12" font-weight="600" fill="#F4F3EF">block 1</text>
  <text x="490" y="242" text-anchor="middle" font-size="11" fill="#F4F3EF">physical block 9</text>

  <rect x="585" y="198" width="170" height="64" rx="7" fill="#D97757" stroke="#191919" stroke-width="1.1"/>
  <text x="670" y="224" text-anchor="middle" font-size="12" font-weight="600" fill="#F4F3EF">block 2</text>
  <text x="670" y="242" text-anchor="middle" font-size="11" fill="#F4F3EF">physical block 12 (own)</text>

  <!-- shared indicator lines -->
  <line x1="310" y1="162" x2="310" y2="198" stroke="#191919" stroke-opacity="0.4" stroke-dasharray="3 3"/>
  <line x1="490" y1="162" x2="490" y2="198" stroke="#191919" stroke-opacity="0.4" stroke-dasharray="3 3"/>

  <text x="850" y="120" font-size="12" fill="#191919">same token_ids in a block</text>
  <text x="850" y="138" font-size="12" fill="#191919">→ same xxhash digest</text>
  <text x="850" y="156" font-size="12" fill="#191919">→ hash_to_block_id already</text>
  <text x="850" y="174" font-size="12" fill="#191919">has an entry — reuse it</text>

  <text x="670" y="285" text-anchor="middle" font-size="11.5" fill="#6B6B6B">diverges here — new tokens, new hash, a fresh block gets allocated</text>
</svg>
