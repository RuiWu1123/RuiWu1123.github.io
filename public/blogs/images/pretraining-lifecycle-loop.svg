<svg viewBox="0 0 1150 390" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <rect x="0" y="0" width="1150" height="390" fill="#F4F3EF"/>
  <text x="575" y="38" text-anchor="middle" font-size="22" font-weight="600" fill="#191919">The Full Loop: Disk to Disk</text>

  <defs>
    <marker id="plarrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#191919"/>
    </marker>
  </defs>

  <!-- Row 1 -->
  <rect x="30" y="90" width="190" height="58" rx="7" fill="#191919" stroke="#191919" stroke-width="1.2"/>
  <text x="125" y="114" text-anchor="middle" font-size="13.5" font-weight="600" fill="#F4F3EF">Disk</text>
  <text x="125" y="132" text-anchor="middle" font-size="11.5" fill="#F4F3EF">raw text corpus</text>

  <rect x="250" y="90" width="190" height="58" rx="7" fill="#F3ECE2" stroke="#191919" stroke-width="1.2"/>
  <text x="345" y="114" text-anchor="middle" font-size="13.5" font-weight="600" fill="#191919">CPU</text>
  <text x="345" y="132" text-anchor="middle" font-size="11.5" fill="#191919">tokenize + batch</text>

  <rect x="470" y="90" width="190" height="58" rx="7" fill="#E6E4DD" stroke="#191919" stroke-width="1.2"/>
  <text x="565" y="114" text-anchor="middle" font-size="13.5" font-weight="600" fill="#191919">Host memory</text>
  <text x="565" y="132" text-anchor="middle" font-size="11.5" fill="#191919">batch ready</text>

  <rect x="690" y="90" width="210" height="58" rx="7" fill="#E3EBF2" stroke="#191919" stroke-width="1.2"/>
  <text x="795" y="114" text-anchor="middle" font-size="13.5" font-weight="600" fill="#191919">GPU memory</text>
  <text x="795" y="132" text-anchor="middle" font-size="11.5" fill="#191919">batch + resident params</text>

  <rect x="920" y="90" width="200" height="58" rx="7" fill="#D97757" stroke="#191919" stroke-width="1.2"/>
  <text x="1020" y="114" text-anchor="middle" font-size="13.5" font-weight="600" fill="#F4F3EF">GPU compute</text>
  <text x="1020" y="132" text-anchor="middle" font-size="11" fill="#F4F3EF">forward → backward → update</text>

  <line x1="220" y1="119" x2="250" y2="119" stroke="#191919" stroke-width="1.4" marker-end="url(#plarrow)"/>
  <line x1="440" y1="119" x2="470" y2="119" stroke="#191919" stroke-width="1.4" marker-end="url(#plarrow)"/>
  <line x1="660" y1="119" x2="690" y2="119" stroke="#191919" stroke-width="1.4" marker-end="url(#plarrow)"/>
  <line x1="900" y1="119" x2="920" y2="119" stroke="#191919" stroke-width="1.4" marker-end="url(#plarrow)"/>

  <!-- repeat loop -->
  <polyline points="970,148 970,170 345,170 345,148" fill="none" stroke="#191919" stroke-opacity="0.55" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#plarrow)"/>
  <text x="657" y="185" text-anchor="middle" font-size="12" fill="#6B6B6B">repeat: next batch, next step</text>

  <!-- checkpoint branch -->
  <polyline points="1070,148 1070,230 705,230 705,290" fill="none" stroke="#191919" stroke-opacity="0.55" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#plarrow)"/>
  <text x="888" y="245" text-anchor="middle" font-size="12" fill="#6B6B6B">periodically</text>

  <!-- Row 2 -->
  <rect x="590" y="290" width="230" height="58" rx="7" fill="#8DA399" stroke="#191919" stroke-width="1.2"/>
  <text x="705" y="314" text-anchor="middle" font-size="13.5" font-weight="600" fill="#F4F3EF">Checkpoint</text>
  <text x="705" y="332" text-anchor="middle" font-size="11.5" fill="#F4F3EF">GPU → CPU → Disk</text>

  <rect x="850" y="290" width="230" height="58" rx="7" fill="#191919" stroke="#191919" stroke-width="1.2"/>
  <text x="965" y="314" text-anchor="middle" font-size="13.5" font-weight="600" fill="#F4F3EF">Disk</text>
  <text x="965" y="332" text-anchor="middle" font-size="11.5" fill="#F4F3EF">trained parameters</text>

  <line x1="820" y1="319" x2="850" y2="319" stroke="#191919" stroke-width="1.4" marker-end="url(#plarrow)"/>
</svg>
